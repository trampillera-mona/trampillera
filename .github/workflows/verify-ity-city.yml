name: Verify ITY CITY integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server JavaScript syntax
        run: node --check app/server.js
      - name: Check preservation and ITY CITY integration
        run: npm test --prefix app
