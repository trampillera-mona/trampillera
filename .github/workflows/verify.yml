name: TRAMPILLERA verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Static checks and source preservation
        run: |
          npm --prefix app run check
          node --test scripts/ai-provider.test.mjs
          node --test scripts/migrations.test.mjs
          node --test scripts/partner-access.test.mjs
          node --test scripts/partner-workspace-ui.test.mjs
          node --test scripts/organization-migration.test.mjs
          node scripts/verify-preservation.mjs
          node --test scripts/locale-voice.test.mjs
          node --check app/public/shared/trampillera-analytics.js
          node --check app/public/shared/trampillera-unified-reality.js
          node --test scripts/analytics-growth.test.mjs
          node --test scripts/unified-reality.test.mjs

      - name: Validate Compose configuration
        run: |
          printf '%s\n' 'POSTGRES_PASSWORD=ci-temporary-db-password' 'ADMIN_PASSWORD=ci-temporary-admin-password-123' 'SESSION_SECRET=ci-temporary-session-secret-which-is-long-enough-123456' 'PUBLIC_APP_URL=https://trampillera-ci.example.test' > .env
          docker compose config --quiet

      - name: Build and start application with PostgreSQL
        run: |
          trap 'docker compose logs app db || true' ERR
          curl() { command curl -H 'Origin: http://127.0.0.1:3000' "$@"; }
          docker compose up -d --build db app
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              echo
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          echo "CI: verify PostgreSQL migrations and normalized organization schema"
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT COUNT(*) FROM schema_migrations"' | tr -d '\r' | grep -qx '3'
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '\''public'\'' AND table_name IN ('\''org_units'\'','\''positions'\'','\''employee_org_assignments'\'')"' | tr -d '\r' | grep -qx '3'
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT COUNT(*) FROM employee_org_assignments"' | tr -d '\r' | grep -qx '0'
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '\''public'\'' AND table_name IN ('\''partner_accounts'\'','\''partner_affiliations'\'','\''partner_invitations'\'','\''partner_projects'\'','\''partner_project_members'\'','\''partner_tasks'\'','\''partner_task_submissions'\'','\''partner_proposals'\'')" ' | tr -d '\r' | grep -qx '8'
          docker compose restart app
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs app db
              exit 1
            fi
            sleep 2
          done
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT COUNT(*) FROM schema_migrations"' | tr -d '\r' | grep -qx '3'
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT COUNT(*) FROM employee_org_assignments"' | tr -d '\r' | grep -qx '0'
          curl --fail --silent http://127.0.0.1:3000/
          curl --fail --silent http://127.0.0.1:3000/shared/trampillera-global-controls.js | grep -q 'TrampilleraLocaleCore'
          curl --fail --silent http://127.0.0.1:3000/shared/trampillera-analytics.js | grep -q 'trampillera.analytics.consent.v1'
          curl --fail --silent http://127.0.0.1:3000/shared/trampillera-unified-reality.js | grep -q 'Unified Reality banner integration'
          curl --fail --silent http://127.0.0.1:3000/shared/trampillera-unified-reality.css | grep -q '#unified-reality-banner'
          curl --fail --silent http://127.0.0.1:3000/ | grep -q 'id="unified-reality-banner"'
          curl --fail --silent http://127.0.0.1:3000/control/growth/ | grep -q 'Audience Intelligence Desk'
          curl --fail --silent http://127.0.0.1:3000/city/ | grep -q 'allow="microphone;'
          curl --fail --silent --dump-header /tmp/trampillera-headers.txt --output /dev/null http://127.0.0.1:3000/api/health
          grep -qi '^Permissions-Policy: microphone=(self)' /tmp/trampillera-headers.txt
          curl --fail --silent http://127.0.0.1:3000/control/ > /dev/null
          curl --fail --silent -H 'Content-Type: application/json' -d '{"visitorId":"11111111-1111-4111-8111-111111111111","path":"/","source":"ci","medium":"test","campaign":""}' http://127.0.0.1:3000/api/analytics/visit | jq -e '.visitors == 1 and .today == 1 and .pageviews == 1'
          curl --fail --silent http://127.0.0.1:3000/api/analytics/counter | jq -e '.visitors == 1 and .today == 1 and .pageviews == 1'
          curl --fail --silent http://127.0.0.1:3000/api/platform/status | jq -e '.status == "available" and .scope == "application_and_postgresql_registry" and .externalIntegrations == "UNKNOWN" and .providerConnectivity == "UNKNOWN"'
          CSRF_STATUS=$(command curl --silent --output /dev/null --write-out '%{http_code}' -H 'Origin: https://attacker.example' -H 'Content-Type: application/json' -d '{"password":"not-a-real-password"}' http://127.0.0.1:3000/api/auth/login)
          test "$CSRF_STATUS" = "403"
          MISSING_ORIGIN_STATUS=$(command curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"password":"not-a-real-password"}' http://127.0.0.1:3000/api/auth/login)
          test "$MISSING_ORIGIN_STATUS" = "403"
          curl --fail --silent -c /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"password":"ci-temporary-admin-password-123"}' http://127.0.0.1:3000/api/auth/login

          echo "CI: verify partner invitation lifecycle, role isolation and project-scoped collaboration"
          INVITE_JSON=$(curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"email":"ci-partner@example.test","name":"CI Partner"}' http://127.0.0.1:3000/api/control/partners/invitations)
          INVITE_TOKEN=$(printf '%s' "$INVITE_JSON" | jq -r '.inviteUrl | split("#invite=")[1]')
          test -n "$INVITE_TOKEN"
          REDEEM_JSON=$(curl --fail --silent -c /tmp/ci-partner-cookies.txt -H 'Content-Type: application/json' -d "{\"token\":\"$INVITE_TOKEN\",\"password\":\"ci-partner-password-123\",\"displayName\":\"CI Partner\"}" http://127.0.0.1:3000/api/auth/partner-invitation/redeem)
          printf '%s' "$REDEEM_JSON" | jq -e '.authenticated == true and .role == "partner"'
          PARTNER_ID=$(curl --fail --silent -b /tmp/ci-partner-cookies.txt http://127.0.0.1:3000/api/auth/me | jq -r '.partner.id')
          test -n "$PARTNER_ID"
          curl --fail --silent -b /tmp/ci-partner-cookies.txt http://127.0.0.1:3000/api/partner/workspace | jq -e '.profile.email == "ci-partner@example.test" and (.projects | length == 0)'
          REPLAY_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d "{\"token\":\"$INVITE_TOKEN\",\"password\":\"ci-partner-password-123\",\"displayName\":\"CI Partner\"}" http://127.0.0.1:3000/api/auth/partner-invitation/redeem)
          test "$REPLAY_STATUS" = "410"
          PARTNER_ADMIN_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -b /tmp/ci-partner-cookies.txt http://127.0.0.1:3000/api/control/partners/invitations)
          test "$PARTNER_ADMIN_STATUS" = "401"
          PROJECT_JSON=$(curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"projectKey":"ci-partner-project","name":"CI Partner Project","description":"Automated access-control verification"}' http://127.0.0.1:3000/api/control/partners/projects)
          PROJECT_ID=$(printf '%s' "$PROJECT_JSON" | jq -r '.item.id')
          curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d "{\"partnerId\":$PARTNER_ID}" "http://127.0.0.1:3000/api/control/partners/projects/$PROJECT_ID/members" | jq -e '.item.partner_id != null'
          TASK_JSON=$(curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"title":"CI scoped task","description":"Claim and submit test"}' "http://127.0.0.1:3000/api/control/partners/projects/$PROJECT_ID/tasks")
          TASK_ID=$(printf '%s' "$TASK_JSON" | jq -r '.item.id')
          curl --fail --silent -b /tmp/ci-partner-cookies.txt -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:3000/api/partner/projects/$PROJECT_ID/tasks/$TASK_ID/claim" | jq -e '.item.status == "CLAIMED"'
          curl --fail --silent -b /tmp/ci-partner-cookies.txt -H 'Content-Type: application/json' -d '{"body":"CI verified contribution","artifactUrl":"https://example.test/artifact"}' "http://127.0.0.1:3000/api/partner/tasks/$TASK_ID/submissions" | jq -e '.item.status == "PENDING"'
          SUBMISSION_ID=$(curl --fail --silent -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/partners/submissions | jq -r '.items[0].id')
          curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"decision":"ACCEPTED","note":"CI review passed"}' "http://127.0.0.1:3000/api/control/partners/submissions/$SUBMISSION_ID/review" | jq -e '.reviewed == true and .decision == "ACCEPTED"'
          PROJECT2_JSON=$(curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"projectKey":"ci-other-project","name":"CI Other Project"}' http://127.0.0.1:3000/api/control/partners/projects)
          PROJECT2_ID=$(printf '%s' "$PROJECT2_JSON" | jq -r '.item.id')
          TASK2_JSON=$(curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"title":"Out of scope task"}' "http://127.0.0.1:3000/api/control/partners/projects/$PROJECT2_ID/tasks")
          TASK2_ID=$(printf '%s' "$TASK2_JSON" | jq -r '.item.id')
          IDOR_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -b /tmp/ci-partner-cookies.txt -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:3000/api/partner/projects/$PROJECT2_ID/tasks/$TASK2_ID/claim")
          test "$IDOR_STATUS" = "409"
          REVOKE_INVITE=$(curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"email":"revoked-partner@example.test","name":"Revoked Partner"}' http://127.0.0.1:3000/api/control/partners/invitations)
          REVOKE_ID=$(printf '%s' "$REVOKE_INVITE" | jq -r '.item.id')
          REVOKE_TOKEN=$(printf '%s' "$REVOKE_INVITE" | jq -r '.inviteUrl | split("#invite=")[1]')
          curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:3000/api/control/partners/invitations/$REVOKE_ID/revoke" | jq -e '.item.status == "REVOKED"'
          REVOKED_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d "{\"token\":\"$REVOKE_TOKEN\",\"password\":\"ci-partner-password-123\",\"displayName\":\"Revoked Partner\"}" http://127.0.0.1:3000/api/auth/partner-invitation/redeem)
          test "$REVOKED_STATUS" = "410"

          curl --fail --silent -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/overview
          curl --fail --silent -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/analytics/summary?days=7 | jq -e '.totals.visitors == 1 and (.daily | length == 7)'
          CAMPAIGN_JSON=$(curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"name":"CI Growth Campaign","channel":"SOCIAL","objective":"Verify campaign attribution","destinationUrl":"https://example.com/landing","budget":0}' http://127.0.0.1:3000/api/control/growth/campaigns)
          CAMPAIGN_ID=$(printf '%s' "$CAMPAIGN_JSON" | jq -r '.item.id')
          CAMPAIGN_SLUG=$(printf '%s' "$CAMPAIGN_JSON" | jq -r '.item.slug')
          test -n "$CAMPAIGN_ID"
          test -n "$CAMPAIGN_SLUG"
          REDIRECT_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3000/go/$CAMPAIGN_SLUG")
          test "$REDIRECT_STATUS" = "302"
          curl --fail --silent -H 'Content-Type: application/json' -d "{\"visitorId\":\"22222222-2222-4222-8222-222222222222\",\"path\":\"/landing\",\"source\":\"social\",\"medium\":\"campaign\",\"campaign\":\"$CAMPAIGN_SLUG\"}" http://127.0.0.1:3000/api/analytics/visit > /dev/null
          curl --fail --silent -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/analytics/summary?days=7 | jq -e --arg slug "$CAMPAIGN_SLUG" '.campaigns[] | select(.slug == $slug and .clicks == 1 and .visits == 1 and .visitors == 1)'
          curl --fail --silent -b /tmp/trampillera-cookies.txt -X PATCH -H 'Content-Type: application/json' -d '{"status":"PAUSED"}' "http://127.0.0.1:3000/api/control/growth/campaigns/$CAMPAIGN_ID" | jq -e '.item.status == "PAUSED"'
          PAUSED_REDIRECT_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3000/go/$CAMPAIGN_SLUG")
          test "$PAUSED_REDIRECT_STATUS" = "404"
          INVALID_LIFECYCLE_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"status":"DISABLED","note":"Attempt to skip required states"}' http://127.0.0.1:3000/api/control/modules/jarviser.core/lifecycle)
          test "$INVALID_LIFECYCLE_STATUS" = "409"
          MISSING_LIFECYCLE_NOTE_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"status":"INSTALLED"}' http://127.0.0.1:3000/api/control/modules/jarviser.core/lifecycle)
          test "$MISSING_LIFECYCLE_NOTE_STATUS" = "400"
          curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"status":"INSTALLED","note":"CI verified discovery to install transition"}' http://127.0.0.1:3000/api/control/modules/jarviser.core/lifecycle | jq -e '.item.status == "INSTALLED"'
          curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"status":"CONFIGURED","note":"CI verified install to configured transition"}' http://127.0.0.1:3000/api/control/modules/jarviser.core/lifecycle | jq -e '.item.status == "CONFIGURED"'
          curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"status":"DISABLED","note":"CI verified configured to disabled transition"}' http://127.0.0.1:3000/api/control/modules/jarviser.core/lifecycle | jq -e '.item.status == "DISABLED"'
          curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"status":"INSTALLED","note":"CI verified disabled to installed transition"}' http://127.0.0.1:3000/api/control/modules/jarviser.core/lifecycle | jq -e '.item.status == "INSTALLED"'
          curl --fail --silent -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/audit | jq -e '.items[] | select(.action == "MODULE_LIFECYCLE_CHANGED" and (.details | contains("note=CI verified discovery to install transition")))'
          curl --fail --silent -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/models | jq -e '.items[] | select(.key == "qwen.model-studio")'
          curl --fail --silent -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/settings | jq -e '.aiProvider | startswith("qwen")'
          AI_NOT_CONFIGURED_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"message":"CI provider configuration check"}' http://127.0.0.1:3000/api/control/ai/chat)
          test "$AI_NOT_CONFIGURED_STATUS" = "503"
          EMPLOYEE_JSON=$(curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"name":"CI Teammate","email":"ci-teammate@example.test","department":"QA","jobTitle":"Tester"}' http://127.0.0.1:3000/api/control/team/employees)
          EMPLOYEE_ID=$(printf '%s' "$EMPLOYEE_JSON" | jq -r '.item.id')
          TEMP_PASSWORD=$(printf '%s' "$EMPLOYEE_JSON" | jq -r '.temporaryPassword')
          test -n "$EMPLOYEE_ID"
          test -n "$TEMP_PASSWORD"
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT COUNT(*) FROM employee_org_assignments"' | tr -d '\r' | grep -qx '0'
          bash scripts/organization-migration.integration.sh "$EMPLOYEE_ID"
          LOGIN_JSON=$(curl --fail --silent -c /tmp/ity-employee-cookies.txt -H 'Content-Type: application/json' -d "{\"email\":\"ci-teammate@example.test\",\"password\":\"$TEMP_PASSWORD\"}" http://127.0.0.1:3000/api/auth/employee-login)
          printf '%s' "$LOGIN_JSON" | jq -e '.mustChangePassword == true'
          PENDING_ACCESS_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -b /tmp/ity-employee-cookies.txt http://127.0.0.1:3000/api/team/dashboard)
          test "$PENDING_ACCESS_STATUS" = "403"
          curl --fail --silent -b /tmp/ity-employee-cookies.txt -c /tmp/ity-employee-cookies.txt -H 'Content-Type: application/json' -d '{"newPassword":"ci-test-personal-password-123"}' http://127.0.0.1:3000/api/auth/change-password
          echo "CI: verify partner affiliation links to an existing employee account"
          EMPLOYEE_INVITE=$(curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"email":"ci-teammate@example.test","name":"CI Teammate"}' http://127.0.0.1:3000/api/control/partners/invitations)
          EMPLOYEE_INVITE_TOKEN=$(printf '%s' "$EMPLOYEE_INVITE" | jq -r '.inviteUrl | split("#invite=")[1]')
          curl --fail --silent -c /tmp/ci-linked-partner-cookies.txt -H 'Content-Type: application/json' -d "{\"token\":\"$EMPLOYEE_INVITE_TOKEN\",\"password\":\"ci-linked-partner-password-123\",\"displayName\":\"CI Teammate\"}" http://127.0.0.1:3000/api/auth/partner-invitation/redeem | jq -e '.authenticated == true'
          curl --fail --silent -b /tmp/ity-employee-cookies.txt http://127.0.0.1:3000/api/auth/me | jq -e '.role == "employee" and (.affiliations | contains(["PARTNER","TEAM_MEMBER"]))'
          curl --fail --silent -b /tmp/ity-employee-cookies.txt http://127.0.0.1:3000/api/partner/workspace | jq -e '.profile.email == "ci-teammate@example.test"'

          EMPLOYEE2_JSON=$(curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"name":"CI Teammate Two","email":"ci-teammate-two@example.test","department":"QA","jobTitle":"Collaborator"}' http://127.0.0.1:3000/api/control/team/employees)
          EMPLOYEE2_ID=$(printf '%s' "$EMPLOYEE2_JSON" | jq -r '.item.id')
          TEMP_PASSWORD2=$(printf '%s' "$EMPLOYEE2_JSON" | jq -r '.temporaryPassword')
          LOGIN2_JSON=$(curl --fail --silent -c /tmp/ity-employee-two-cookies.txt -H 'Content-Type: application/json' -d "{\"email\":\"ci-teammate-two@example.test\",\"password\":\"$TEMP_PASSWORD2\"}" http://127.0.0.1:3000/api/auth/employee-login)
          printf '%s' "$LOGIN2_JSON" | jq -e '.mustChangePassword == true'
          curl --fail --silent -b /tmp/ity-employee-two-cookies.txt -c /tmp/ity-employee-two-cookies.txt -H 'Content-Type: application/json' -d '{"newPassword":"ci-test-personal-password-456"}' http://127.0.0.1:3000/api/auth/change-password
          echo "CI: publish shared mission"
          MISSION_JSON=$(curl --silent --show-error -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d "{\"title\":\"CI cooperative mission\",\"description\":\"Verify the complete employee mission lifecycle in CI.\",\"category\":\"QA\",\"xpReward\":75,\"employeeIds\":[$EMPLOYEE_ID,$EMPLOYEE2_ID]}" http://127.0.0.1:3000/api/control/team/missions)
          echo "CI mission API response: $MISSION_JSON"
          MISSION_ID=$(printf '%s' "$MISSION_JSON" | jq -r '.item.id')
          curl --fail --silent -b /tmp/ity-employee-two-cookies.txt -H 'Content-Type: application/json' -d '{"body":"Message from teammate two"}' "http://127.0.0.1:3000/api/team/missions/$MISSION_ID/messages"
          curl --fail --silent -b /tmp/ity-employee-cookies.txt "http://127.0.0.1:3000/api/team/missions/$MISSION_ID/messages" | jq -e '.items | length == 1'
          curl --fail --silent -b /tmp/ity-employee-cookies.txt -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:3000/api/team/missions/$MISSION_ID/start"
          curl --fail --silent -b /tmp/ity-employee-cookies.txt -H 'Content-Type: application/json' -d '{"note":"Completed the cooperative integration smoke test."}' "http://127.0.0.1:3000/api/team/missions/$MISSION_ID/submit"
          curl --fail --silent -b /tmp/ity-employee-cookies.txt http://127.0.0.1:3000/api/team/dashboard | jq -e '.stats.xp == 0 and .stats.awaiting == 1'
          SUBMISSION_JSON=$(curl --fail --silent -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/team/submissions)
          ASSIGNMENT_ID=$(printf '%s' "$SUBMISSION_JSON" | jq -r '.items[0].assignment_id')
          curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"decision":"VERIFIED","note":"CI verified result"}' "http://127.0.0.1:3000/api/control/team/submissions/$ASSIGNMENT_ID/review"
          curl --fail --silent -b /tmp/ity-employee-cookies.txt http://127.0.0.1:3000/api/team/dashboard | jq -e '.stats.xp == 75 and .stats.completed == 1'
          curl --fail --silent -b /tmp/ity-employee-two-cookies.txt -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:3000/api/team/missions/$MISSION_ID/start"
          curl --fail --silent -b /tmp/ity-employee-two-cookies.txt -H 'Content-Type: application/json' -d '{"note":"Second employee submits a result for review."}' "http://127.0.0.1:3000/api/team/missions/$MISSION_ID/submit"
          SUBMISSION2_JSON=$(curl --fail --silent -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/team/submissions)
          ASSIGNMENT2_ID=$(printf '%s' "$SUBMISSION2_JSON" | jq -r '.items[0].assignment_id')
          curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"decision":"REJECTED","note":"Please add a clearer result summary."}' "http://127.0.0.1:3000/api/control/team/submissions/$ASSIGNMENT2_ID/review"
          curl --fail --silent -b /tmp/ity-employee-two-cookies.txt http://127.0.0.1:3000/api/team/dashboard | jq -e '.stats.xp == 0 and .stats.completed == 0'
          curl --fail --silent -b /tmp/ity-employee-two-cookies.txt -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:3000/api/team/missions/$MISSION_ID/start"
          RESET2_JSON=$(curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:3000/api/control/team/employees/$EMPLOYEE2_ID/reset-password")
          RESET2_PASSWORD=$(printf '%s' "$RESET2_JSON" | jq -r '.temporaryPassword')
          RESET2_OLD_SESSION_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -b /tmp/ity-employee-two-cookies.txt http://127.0.0.1:3000/api/team/dashboard)
          test "$RESET2_OLD_SESSION_STATUS" = "401"
          curl --fail --silent -c /tmp/ity-employee-two-reset-cookies.txt -H 'Content-Type: application/json' -d "{\"email\":\"ci-teammate-two@example.test\",\"password\":\"$RESET2_PASSWORD\"}" http://127.0.0.1:3000/api/auth/employee-login | jq -e '.mustChangePassword == true'
          curl --fail --silent -b /tmp/ity-employee-two-reset-cookies.txt -c /tmp/ity-employee-two-reset-cookies.txt -H 'Content-Type: application/json' -d '{"newPassword":"ci-test-reset-password-789"}' http://127.0.0.1:3000/api/auth/change-password
          curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"active":false}' "http://127.0.0.1:3000/api/control/team/employees/$EMPLOYEE_ID/status"
          DISABLED_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -b /tmp/ity-employee-cookies.txt http://127.0.0.1:3000/api/team/dashboard)
          test "$DISABLED_STATUS" = "401"
          echo "CI: revoke administrator sessions after credential rotation"
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "UPDATE admin_auth_state SET auth_version=auth_version+1 WHERE singleton_id=1"' > /dev/null
          ADMIN_OLD_SESSION_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/overview)
          test "$ADMIN_OLD_SESSION_STATUS" = "401"

      - name: Stop test stack
        if: always()
        run: |
          if [ -f .env ]; then docker compose down -v || true; fi
          rm -f .env /tmp/trampillera-cookies.txt /tmp/ity-employee-cookies.txt /tmp/ity-employee-two-cookies.txt /tmp/ity-employee-two-reset-cookies.txt
