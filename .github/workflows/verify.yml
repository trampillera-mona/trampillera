name: TRAMPILLERA verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static checks and source preservation
        run: |
          npm --prefix app run check
          node scripts/verify-preservation.mjs
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const html=readFileSync("app/public/control/index.html","utf8"); const script=html.match(/<script>([\s\\S]*?)<\/script>/); if(!script) throw new Error("Control Plane script missing"); new Function(script[1]); console.log("Control Plane browser JavaScript syntax passed.")'

      - name: Validate Compose configuration
        run: |
          printf '%s\n' 'POSTGRES_PASSWORD=ci-temporary-db-password' 'ADMIN_PASSWORD=ci-temporary-admin-password-123' 'SESSION_SECRET=ci-temporary-session-secret-which-is-long-enough-123456' > .env
          docker compose config --quiet

      - name: Build and start application with PostgreSQL
        run: |
          docker compose up -d --build db app
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              echo
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/
          curl --fail --silent http://127.0.0.1:3000/control/ > /dev/null
          curl --fail --silent http://127.0.0.1:3000/api/platform/status
          curl --fail --silent -c /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"password":"ci-temporary-admin-password-123"}' http://127.0.0.1:3000/api/auth/login
          curl --fail --silent -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/overview
          curl --fail --silent -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/operations/domains > /tmp/domains.json
          curl --fail --silent -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/operations/summary > /tmp/ops-summary.json
          record=$(curl --fail --silent -b /tmp/trampillera-cookies.txt -H 'Content-Type: application/json' -d '{"domain":"tasks","title":"CI operational record","status":"OPEN","payload":{"owner":"CI"}}' http://127.0.0.1:3000/api/control/operations/records)
          record_id=$(printf '%s' "$record" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).item.id)))')
          curl --fail --silent -b /tmp/trampillera-cookies.txt -X PATCH -H 'Content-Type: application/json' -d '{"expectedVersion":1,"status":"IN_PROGRESS"}' "http://127.0.0.1:3000/api/control/operations/records/$record_id" > /tmp/ops-update.json
          invalid_status=$(curl --silent -o /tmp/ops-invalid.json -w '%{http_code}' -b /tmp/trampillera-cookies.txt -X PATCH -H 'Content-Type: application/json' -d '{"expectedVersion":2,"status":"CANCELLED"}' "http://127.0.0.1:3000/api/control/operations/records/$record_id")
          test "$invalid_status" = "409"
          curl --fail --silent -b /tmp/trampillera-cookies.txt http://127.0.0.1:3000/api/control/audit | grep -q OPERATIONAL_RECORD_UPDATED

      - name: Stop test stack
        if: always()
        run: |
          docker compose down -v
          rm -f .env /tmp/trampillera-cookies.txt
