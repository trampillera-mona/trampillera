<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09121c"><title>ITY CITY · Corporate Environment</title>
<style>
:root{color-scheme:dark;--bg:#09121c;--line:#294153;--text:#e9f3fb;--muted:#9ab0c1;--cyan:#5bd9ef}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,Segoe UI,sans-serif}body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}header{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 22px;border-bottom:1px solid var(--line);background:#0c1722}.brand{display:flex;align-items:center;gap:12px;min-width:190px}.mark{width:42px;height:42px;border:1px solid var(--cyan);border-radius:12px;display:grid;place-items:center;color:var(--cyan);font-weight:900;box-shadow:0 0 24px #5bd9ef22}.brand strong{display:block;font-size:13px;letter-spacing:.14em}.brand small{display:block;color:var(--muted);font:9px ui-monospace,monospace;letter-spacing:.13em;margin-top:3px}nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.tab,header a{border:1px solid transparent;background:transparent;color:#afc2d1;padding:9px 12px;border-radius:9px;text-decoration:none;font:11px ui-monospace,monospace;cursor:pointer}.tab:hover,header a:hover{border-color:#3a6277;color:white}.tab.active{background:#173247;border-color:#37637a;color:#eaffff}.tab .n{color:var(--cyan);margin-right:7px}.right{display:flex;align-items:center;gap:9px}.demo{font:9px ui-monospace,monospace;color:#f0c982;border:1px solid #715b34;border-radius:99px;padding:7px 10px;white-space:nowrap}.admin{background:#153142;border:1px solid #2e6479;color:#dffaff}main{min-height:0;position:relative;background:radial-gradient(ellipse at 50% 0,#142d3c,transparent 45%),var(--bg)}.frame{width:100%;height:100%;border:0;display:block;background:#090e16}.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font:11px ui-monospace,monospace;pointer-events:none}@media(max-width:900px){header{align-items:flex-start;flex-wrap:wrap;padding:10px 12px;gap:8px}.brand{min-width:auto}.right{margin-left:auto}nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}.tab{white-space:nowrap}.brand small{display:none}}
</style></head><body>
<header><div class="brand"><div class="mark">IC</div><div><strong>ITY CITY</strong><small>CORPORATE DIGITAL ENVIRONMENT</small></div></div>
<nav aria-label="ITY CITY modules"><button class="tab active" data-module="workspace"><span class="n">01</span>WORKSPACE</button><button class="tab" data-module="campus"><span class="n">02</span>CORPORATE CAMPUS</button><button class="tab" data-module="multiverse"><span class="n">03</span>CORPORATE MULTIVERSE</button><button class="tab" data-module="team"><span class="n">04</span>TEAM GAME</button></nav>
<div class="right"><span class="demo" id="moduleMode" title="Workspace, Campus and Multiverse store state in this browser; no shared server persistence.">PROTOTYPE · LOCAL MODULE DATA</span><a class="admin" href="/control/" target="_blank" rel="noopener">CONTROL PLANE ↗</a></div></header>
<main><div class="loading" id="loading">LOADING WORKSPACE…</div><iframe class="frame" id="moduleFrame" title="ITY CITY Workspace" src="/city/workspace/" allow="microphone; fullscreen; clipboard-read; clipboard-write" allowfullscreen></iframe></main>
<script>(()=>{const routes={workspace:"/city/workspace/",campus:"/city/campus/",multiverse:"/city/multiverse/",team:"/city/team/"};const labels={workspace:"ITY CITY Workspace",campus:"ITY CITY Corporate Campus",multiverse:"ITY CITY Corporate Multiverse",team:"ITY CITY Team Missions"};const frame=document.getElementById("moduleFrame"),loading=document.getElementById("loading"),mode=document.getElementById("moduleMode");function activate(key){if(!routes[key])return;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.module===key));frame.title=labels[key];mode.textContent=key==="team"?"SERVER-BACKED · TEAM GAME":"PROTOTYPE · LOCAL MODULE DATA";mode.title=key==="team"?"Team Game uses shared employee identity and PostgreSQL mission state.":"Workspace, Campus and Multiverse store state in this browser; no shared server persistence.";mode.dataset.mode=key==="team"?"server":"local";loading.style.display="grid";frame.src=routes[key];history.replaceState(null,"","#"+key)}frame.addEventListener("load",()=>{loading.style.display="none"});document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>activate(b.dataset.module)));window.addEventListener("message",function(event){if(event.origin!==location.origin||!event.data||event.data.type!=="TRAMPILLERA_NAVIGATE")return;var key=event.data.module;if(Object.prototype.hasOwnProperty.call(routes,key))activate(key)});const initial=location.hash.slice(1);if(routes[initial])activate(initial)})();</script><script src="/shared/trampillera-global-controls.js"></script>
<script src="/shared/trampillera-image-protection.js" defer></script>
</body></html>
